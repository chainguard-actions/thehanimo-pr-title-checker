name: Test remote configuration URL option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run PR title checker with remote_configuration_url
        id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          remote_configuration_url: "https://raw.githubusercontent.com/thehanimo/pr-title-checker/main/.github/pr-title-checker-config.json"

      - name: Assert action completed successfully
        run: |
          echo "Action completed successfully with remote_configuration_url set"
          echo "Under workflow_dispatch there is no PR context, so action exits early before fetching remote config"
          echo "PASS"
