name: Test remote_configuration_url
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start local HTTP server with config
        run: |
          mkdir -p /tmp/pr-title-config
          cat > /tmp/pr-title-config/config.json << 'EOF'
          {
            "LABEL": {
              "name": "title needs formatting",
              "color": "EEEEEE"
            },
            "CHECKS": [
              {
                "pattern": "^(feat|fix|docs|style|refactor|test|chore)(\\(.+\\))?: .+",
                "error": "PR title must follow conventional commits format"
              }
            ],
            "alwaysPassCI": true
          }
          EOF
          cd /tmp/pr-title-config
          python3 -m http.server 8765 &
          echo "HTTP server started"
          sleep 1

      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_configuration_url: "http://localhost:8765/config.json"
          pass_on_octokit_error: "true"

      - name: Assert action passed or failed gracefully with remote config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success output: $SUCCESS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with remote config (pass_on_octokit_error=true)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable or remote config fetch failed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
