name: Test default behavior (pass_on_octokit_error false)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run PR title checker with pass_on_octokit_error disabled (default)
        id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          pass_on_octokit_error: "false"
          configuration_path: .github/pr-title-checker-config.json

      - name: Assert action completed successfully (exits early - no PR context)
        run: |
          echo "Action completed successfully with pass_on_octokit_error=false"
          echo "Under workflow_dispatch there is no PR context, so action exits early before any API calls"
          echo "PASS"
