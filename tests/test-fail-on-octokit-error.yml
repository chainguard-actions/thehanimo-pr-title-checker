name: Test pass_on_octokit_error=false (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action is a JS action that reads github.context.payload.pull_request,
      # which is undefined under workflow_dispatch. It also uses Octokit to fetch
      # the config file from the (sentinel) repo, which will fail.
      # With pass_on_octokit_error=false (default), the action should fail.
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          pass_on_octokit_error: "false"
          configuration_path: ".github/pr-title-checker-config.json"
        continue-on-error: true

      - name: Assert action failed gracefully on Octokit/context error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when pass_on_octokit_error=false and repo/PR context is unavailable"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable if context was available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
