name: Test fail on octokit error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local config file
        run: |
          mkdir -p /tmp/pr-title-config
          cat > /tmp/pr-title-config/config.json << 'EOF'
          {
            "LABEL": {
              "name": "title needs formatting",
              "color": "EEEEEE"
            },
            "CHECKS": [
              {
                "pattern": "^(feat|fix|docs|style|refactor|test|chore)(\\(.+\\))?: .+",
                "error": "PR title must follow conventional commits format"
              }
            ],
            "alwaysPassCI": false
          }
          EOF

      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          pass_on_octokit_error: "false"
          local_configuration_path: /tmp/pr-title-config/config.json
        continue-on-error: true

      - name: Assert action failed due to no PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch there is no PR, so the action should fail
          # when pass_on_octokit_error is false (the default behavior)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no PR context and pass_on_octokit_error=false"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (may have handled missing PR gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
