name: Test github_configuration_* inputs and GITHUB_TOKEN
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          pass_on_octokit_error: "true"
          github_configuration_owner: actions
          github_configuration_repo: checkout
          github_configuration_path: .github/pr-title-checker-config.json
          github_configuration_ref: main
          github_configuration_token: ${{ github.token }}

      - name: Assert action ran (passed or failed gracefully with sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success output: $SUCCESS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with github_configuration_* inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or missing config is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
