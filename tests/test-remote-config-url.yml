name: Test remote configuration URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a local HTTP server with config
        run: |
          # Create a config file to serve
          mkdir -p /tmp/remote-config
          cat > /tmp/remote-config/config.json << 'EOF'
          {
            "LABEL": {
              "name": "title needs formatting",
              "color": "EEEEEE"
            },
            "CHECKS": [
              {
                "pattern": "^(feat|fix|docs|style|refactor|test|chore)(\\(.+\\))?: .+",
                "error": "PR title must follow conventional commits format"
              }
            ],
            "alwaysPassCI": true
          }
          EOF
          # Serve the config file on localhost
          cd /tmp/remote-config && python3 -m http.server 8765 &
          sleep 1
          echo "Server started"
          # Verify the server is running
          curl -sf http://localhost:8765/config.json | head -5

      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          pass_on_octokit_error: "true"
          remote_configuration_url: http://localhost:8765/config.json
        continue-on-error: true

      - name: Assert action ran with remote config URL
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with remote config URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under workflow_dispatch - no PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
