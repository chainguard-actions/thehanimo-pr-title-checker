name: Test local configuration file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run PR title checker with local config file
        id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          local_configuration_path: tests/fixtures/pr-title-checker-config.json

      - name: Assert action completed successfully with local config
        run: |
          echo "Action completed without error using local config (no PR context under workflow_dispatch)"
          echo "PASS"
