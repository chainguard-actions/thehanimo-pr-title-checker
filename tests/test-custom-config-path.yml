name: Test custom configuration_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts a custom configuration_path input.
      # Under the harness, Octokit will fail to fetch the config from the sentinel repo.
      # With pass_on_octokit_error=true, the action should pass gracefully regardless.
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          pass_on_octokit_error: "true"
          configuration_path: ".github/custom-pr-title-config.json"

      - name: Assert action passed gracefully with custom config path
        run: |
          echo "Action completed without failing the workflow"
          echo "PASS: action passed with custom configuration_path and pass_on_octokit_error=true"
