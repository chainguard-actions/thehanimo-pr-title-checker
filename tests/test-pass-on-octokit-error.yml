name: Test pass_on_octokit_error=true
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action is a JS action that reads github.context.payload.pull_request,
      # which is undefined under workflow_dispatch. It also uses Octokit to fetch
      # the config file from the (sentinel) repo, which will fail.
      # With pass_on_octokit_error=true, the action should pass gracefully.
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          pass_on_octokit_error: "true"
          configuration_path: ".github/pr-title-checker-config.json"

      - name: Assert action passed gracefully
        run: |
          echo "Action completed without failing the workflow"
          echo "PASS: action passed with pass_on_octokit_error=true"
