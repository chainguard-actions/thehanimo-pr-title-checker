name: Test pass_on_octokit_error option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run PR title checker with pass_on_octokit_error enabled
        id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          pass_on_octokit_error: "true"
          configuration_path: .github/pr-title-checker-config.json

      - name: Assert action completed successfully with pass_on_octokit_error=true
        run: |
          echo "Action completed successfully with pass_on_octokit_error=true"
          echo "Under workflow_dispatch there is no PR context, so action exits early"
          echo "PASS"
