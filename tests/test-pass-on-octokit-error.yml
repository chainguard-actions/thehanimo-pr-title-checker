name: Test pass_on_octokit_error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config file
        run: |
          mkdir -p .github
          cat > .github/pr-title-checker-config.json << 'EOF'
          {
            "LABEL": {
              "name": "title needs formatting",
              "color": "EEEEEE"
            },
            "CHECKS": [
              {
                "pattern": "^(feat|fix|docs|style|refactor|test|chore)(\\(.+\\))?: .+",
                "error": "PR title must follow conventional commits format"
              }
            ],
            "alwaysPassCI": true
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          pass_on_octokit_error: "true"

      - name: Assert action passed or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success output: $SUCCESS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (pass_on_octokit_error=true)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
