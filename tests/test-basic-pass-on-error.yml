name: Test basic usage with pass_on_octokit_error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create default config file
        run: |
          mkdir -p .github
          cat > .github/pr-title-checker-config.json << 'EOF'
          {
            "LABEL": {
              "name": "title needs formatting",
              "color": "EEEEEE"
            },
            "CHECKS": [
              {
                "pattern": "^(feat|fix|docs|style|refactor|test|chore)(\\(.+\\))?: .+",
                "on_failed_checks": [
                  {
                    "action": "label",
                    "payload": {
                      "label": "title needs formatting"
                    }
                  }
                ]
              }
            ]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          pass_on_octokit_error: "true"
          configuration_path: .github/pr-title-checker-config.json

      - name: Assert action ran and passed (octokit error is tolerated)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (pass_on_octokit_error=true handled API failure)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed even with pass_on_octokit_error=true"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
