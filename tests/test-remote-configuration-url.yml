name: Test remote_configuration_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          pass_on_octokit_error: true
          remote_configuration_url: https://raw.githubusercontent.com/thehanimo/pr-title-checker/main/.github/pr-title-checker-config.json

      - name: Assert action ran (no PR context expected under workflow_dispatch)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "outcome: $OUTCOME"
          echo "success output: $SUCCESS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (pass_on_octokit_error=true handled missing PR context)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no PR context under workflow_dispatch)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
