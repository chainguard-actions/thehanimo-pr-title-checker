name: Test basic usage (no PR context)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run PR title checker (no PR context - should exit early)
        id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          configuration_path: .github/pr-title-checker-config.json

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error (exited early - no PR context under workflow_dispatch)"
          echo "PASS"
