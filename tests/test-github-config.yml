name: Test github configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          github_configuration_owner: thehanimo
          github_configuration_repo: pr-title-checker
          github_configuration_path: .github/pr-title-checker-config.json
          github_configuration_ref: main
          github_configuration_token: ${{ github.token }}
          pass_on_octokit_error: true
      - name: Assert action completed
        run: |
          echo "Action completed successfully with github_configuration_* inputs (pass_on_octokit_error=true)"
          echo "PASS"
